[build-system]
requires = ["setuptools>=68", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fynance"
version = "1.3.0"
description = "Python and Cython scripts of machine learning, econometrics and statistical features for financial analysis"
readme = "README.rst"
license = { text = "MIT" }
authors = [{ name = "Arthur Bernard", email = "arthur.bernard.92@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "matplotlib>=3.7",
    "numba>=0.59",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "seaborn>=0.12",
    "torch>=2.0",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "Cython>=3.0",
    "pytest>=7.4",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "numpydoc",
]
doc = [
    "sphinx>=7.0",
    "furo",
    "numpydoc",
    "nbsphinx",
    "sphinx-design",
    "sphinx-copybutton",
]

[project.urls]
Homepage = "https://github.com/ArthurBernard/Fynance"
Documentation = "https://fynance.readthedocs.io/"
"Source Code" = "https://github.com/ArthurBernard/Fynance/"
Download = "https://pypi.org/project/fynance/"

[tool.setuptools.packages.find]
include = ["fynance*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --exitfirst -vv --capture=no --ignore=fynance/dev"
testpaths = ["fynance"]
filterwarnings = [
    # Third-party deprecation noise (numpy, pandas, torch, etc.) is out of
    # scope — keep it visible but non-fatal. Listed first because pytest
    # prepends filters: the LAST entry is checked first, so fynance-internal
    # rules below take precedence over these defaults.
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
    # Promote internal deprecations to errors so they cannot ship silently.
    "error::DeprecationWarning:fynance\\..*",
    "error::PendingDeprecationWarning:fynance\\..*",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["*.pyx", "*.pxd", "setup.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"fynance/**/__init__.py" = ["F401", "F403", "F405"]
"fynance/__init__.py" = ["F401", "F403", "F405"]
# Dual Cython/Python files use star imports to pull Cython symbols
"fynance/algorithms/browsers.py" = ["F403", "F405"]
"fynance/features/metrics.py" = ["F403", "F405"]
"fynance/features/momentums.py" = ["F403", "F405"]
"fynance/features/roll_functions.py" = ["F403", "F405"]
"fynance/features/scale.py" = ["F403", "F405"]
"fynance/models/econometric_models.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "fynance.features.metrics_cy",
  "fynance.features.momentums_cy",
  "fynance.features.roll_functions_cy",
  "fynance.models.econometric_models_cy",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["fynance"]
ignore_errors = true
